<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/family-records/" />
  <title>Family Records</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 2px; }
    .sub { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; margin: 0 0 16px; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hub-border, #e5e7eb); margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 14px; border: none; background: none; cursor: pointer; color: var(--hub-text-muted, #6b7280);
      font-size: 0.9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--hub-primary, #4f46e5); border-bottom-color: var(--hub-primary, #4f46e5); font-weight: 600; }

    .card { background: var(--hub-surface, #fff); border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 10px); padding: 14px; margin-bottom: 12px; }
    .spread { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .muted { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; }
    .empty { text-align: center; color: var(--hub-text-muted, #6b7280); padding: 40px 16px; }
    .empty-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }

    .btn { border: 1px solid var(--hub-border, #d1d5db); background: var(--hub-surface, #fff); color: var(--hub-text, #000000);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; }
    .btn:hover:not(:disabled) { background: var(--hub-bg, #f3f4f6); }
    .btn-primary { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }
    .btn-primary:hover:not(:disabled) { background: var(--hub-primary-hover, #4338ca); }
    .btn-danger { color: #b91c1c; border-color: #fca5a5; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-sm { padding: 4px 9px; font-size: 0.8rem; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input[type=search] { flex: 1; min-width: 160px; }

    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .pill { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--hub-border, #e5e7eb);
      background: var(--hub-surface, #fff); cursor: pointer; font-size: 0.85rem; color: inherit; }
    .pill.active { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }

    .rec-title { font-weight: 600; }
    .rec-meta { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); margin-top: 2px; }
    .rec-note { font-size: 0.86rem; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
    .rec-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

    .chip { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
    .chip-expired { background: #fee2e2; color: #991b1b; }
    .chip-soon    { background: #fef3c7; color: #92400e; }
    .chip-retired { background: #e5e7eb; color: #374151; }

    .info-group { margin-bottom: 14px; }
    .info-group h4 { margin: 0 0 6px; font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.03em; color: var(--hub-text-muted, #6b7280); }
    .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0;
      border-bottom: 1px solid var(--hub-border, #f3f4f6); font-size: 0.9rem; }
    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--hub-text-muted, #6b7280); }
    .info-val { text-align: right; white-space: pre-wrap; word-break: break-word; }

    label.field { display: block; margin-bottom: 10px; font-size: 0.85rem; }
    label.field > span { display: block; margin-bottom: 4px; color: var(--hub-text-muted, #6b7280); }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--hub-border, #d1d5db);
      border-radius: 8px; font: inherit; background: var(--hub-surface, #fff); color: var(--hub-text, #000000); }
    textarea { resize: vertical; min-height: 60px; }
    .field-row { display: flex; gap: 10px; }
    .field-row > * { flex: 1; }
    .hint { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin: -4px 0 10px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
      align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--hub-surface, #fff); border-radius: var(--hub-radius, 12px); padding: 18px;
      max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🗂️ Family Records</h1>
    <p class="sub">The paperwork and the details that travel with a child — in one place both homes can reach.</p>
    <div id="tabs" class="tabs"></div>
    <div id="content"></div>
  </div>

  <script type="module">
    import {
      esc, isAdult, hubConfirm, hubAlert, createFilesHelper, searchMatch,
      createVersionedRecordsHelper,
    } from "/hub-sdk.js";
    import {
      CATEGORIES, categoryFor, expiryStatus, expiryLabel, visibleRecords,
      validateRecord, CHILD_INFO_FIELDS, groupedChildInfo, isChildInfoEmpty, fmtBytes, searchableFields,
      liveRecords, retiredRecords, versionsOf, purgeStateFor, changedChildInfo,
    } from "./logic.js";

    // ── Runtime globals ──────────────────────────────────────────────────────
    const CONTEXT = window.__CONTEXT_URL ?? "";
    const DB      = window.__DB_URL      ?? "";
    const FILES   = createFilesHelper(window.__FILES_URL ?? "");
    const CAN_UPLOAD = !!window.__FILES_URL;
    const APP_ID  = "family-records";
    // Every write to records and child_info goes through this. The tables are
    // endpoint_only, so app SQL cannot update or delete them at all — which is
    // exactly what makes "replacing keeps the old version" a fact rather than a
    // convention this file happens to follow.
    const VERSIONED = createVersionedRecordsHelper(APP_ID);
    const P       = "app_family_records__";
    const DEMO    = !DB;

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `DB error ${res.status}`);
      return res.json();
    }

    /** Today in the VIEWER's local date — never toISOString(), which is UTC. */
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // ── State ────────────────────────────────────────────────────────────────
    let me = window.__CURRENT_MEMBER ?? null;
    let members = [], memberMap = new Map();
    let records = [], childInfo = new Map();   // child_id → info row
    let recordVersions = [], infoVersions = [], purges = [];
    // Which side of a two-parent agreement this member signs for, or null in a
    // household install where there is no second party at all. Derived from the
    // pending rows themselves — the app never sees household ids.
    let showRetired = false;
    let view = "records";
    let filterChild = "all", filterCategory = "all", query = "";
    let searchTimer = null;
    let modalEl = null;
    let pendingFile = null;                     // { id, name, mime, size } after upload

    function memberName(id) { return memberMap.get(id)?.name ?? "Unknown"; }
    function children() { return members.filter(m => !isAdult(m, members)); }
    // Both tables are adult_only: non-adults can't read them at all, so the
    // whole app is adults-only rather than read-only for kids.
    const canRead = () => !!me && isAdult(me, members);

    // ── Loading ──────────────────────────────────────────────────────────────
    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-dad", name: "Dad", role: "adult" },
          { id: "demo-mom", name: "Mom", role: "adult" },
          { id: "demo-sam", name: "Sam", role: "child" },
          { id: "demo-ada", name: "Ada", role: "child" },
        ];
        me = me ?? members[0];
        memberMap = new Map(members.map(m => [m.id, m]));
        return;
      }
      try {
        const res = await fetch(`${CONTEXT}?keys=family.members`);
        members = ((await res.json())["family.members"]) ?? [];
      } catch { members = []; }
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    async function loadData() {
      if (DEMO) { seedDemo(); return; }
      if (!canRead()) { records = []; childInfo = new Map(); return; }
      const [recs, info, recVersions, infoVers, purgeRows] = await Promise.all([
        db(`SELECT * FROM ${P}records`).catch(() => ({ rows: [] })),
        db(`SELECT * FROM ${P}child_info`).catch(() => ({ rows: [] })),
        // Superseded versions carry the file id of the document they held, so
        // the history list can still link straight to the bytes.
        db(`SELECT * FROM ${P}record_versions ORDER BY superseded_at DESC`).catch(() => ({ rows: [] })),
        db(`SELECT * FROM ${P}child_info_versions ORDER BY superseded_at DESC`).catch(() => ({ rows: [] })),
        db(`SELECT * FROM ${P}record_purge_agreements ORDER BY updated_at DESC`).catch(() => ({ rows: [] })),
      ]);
      records = recs.rows;
      childInfo = new Map(info.rows.map(r => [r.child_id, r]));
      recordVersions = recVersions.rows;
      infoVersions = infoVers.rows;
      purges = purgeRows.rows;
    }

    function seedDemo() {
      const t = todayStr();
      const shift = (n) => {
        const d = new Date(t + "T12:00:00");
        d.setDate(d.getDate() + n);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      };
      records = [
        { id: "r1", title: "Custody agreement (signed)", record_kind: "document", category: "legal",
          child_id: null, note: "Filed 2024. Section 4 covers holiday rotation.", expires_on: null,
          file_id: null, created_by: "demo-mom", created_at: "2026-01-04T10:00:00Z", updated_at: "2026-01-04T10:00:00Z" },
        { id: "r2", title: "Sam — insurance card", record_kind: "reference", category: "insurance",
          child_id: "demo-sam", note: "Member ID 88213-C, group 4471.", expires_on: shift(20),
          file_id: null, created_by: "demo-dad", created_at: "2026-02-11T10:00:00Z", updated_at: "2026-02-11T10:00:00Z" },
        { id: "r3", title: "Ada — passport", record_kind: "reference", category: "identity",
          child_id: "demo-ada", note: "In the safe at Mom's.", expires_on: shift(-9),
          file_id: null, created_by: "demo-mom", created_at: "2026-03-02T10:00:00Z", updated_at: "2026-03-02T10:00:00Z" },
        { id: "r4", title: "Field trip consent form", record_kind: "reference", category: "school",
          child_id: "demo-sam", note: "Returned to the office 12 Mar.", expires_on: null,
          file_id: null, created_by: "demo-dad", created_at: "2026-03-12T10:00:00Z", updated_at: "2026-03-12T10:00:00Z" },
      ];
      childInfo = new Map([["demo-sam", {
        child_id: "demo-sam", blood_type: "O+", allergies: "Peanuts (EpiPen in backpack)",
        medications: "Cetirizine 5mg, mornings", doctor_name: "Dr. Reyes", doctor_phone: "555-0142",
        dentist_name: "Bright Smile Dental", dentist_phone: "555-0188",
        school_name: "Lakeside Elementary", school_phone: "555-0110", teacher_name: "Ms. Okafor",
        shirt_size: "Youth M", pants_size: "10", shoe_size: "4", notes: "Afraid of thunderstorms.",
        updated_by: "demo-mom", updated_at: "2026-03-01T10:00:00Z", version: 1,
      }]]);
      for (const r of records) r.version = 1;
      records[0].version = 2;   // r1 has one superseded version below
      recordVersions = [
        { id: "v1", record_id: "r1", version: 1, superseded_at: "2026-01-02T10:00:00Z",
          superseded_by: "demo-dad", title: "Custody agreement (draft)", record_kind: "reference",
          category: "legal", child_id: null, note: "Superseded by the signed copy.",
          expires_on: null, file_id: null, created_by: "demo-mom", created_at: "2025-12-01T10:00:00Z" },
      ];
      infoVersions = [];
      purges = [];
    }

    // ══════════════════════════════════════════════════════════════════════════
    // Rendering
    // ══════════════════════════════════════════════════════════════════════════
    const TABS = [["records", "🗂️ Records"], ["children", "🧒 Child info"]];

    function render() {
      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = TABS.map(([id, label]) =>
        `<button class="tab ${view === id ? "active" : ""}" data-tab="${id}">${esc(label)}</button>`
      ).join("");
      tabsEl.querySelectorAll("[data-tab]").forEach(b =>
        b.addEventListener("click", () => { view = b.dataset.tab; render(); }));

      const el = document.getElementById("content");
      if (!canRead()) {
        el.innerHTML = `<div class="empty"><span class="empty-icon">🔒</span>
          Family Records is available to adults in this household.</div>`;
        return;
      }
      (view === "children" ? renderChildren : renderRecords)(el);
    }

    // ── Records view ─────────────────────────────────────────────────────────
    function renderRecords(el) {
      const today = todayStr();
      // Text search runs first with the shared matcher; visibleRecords keeps
      // its own job (child/category filtering and expiry-urgency ordering).
      const pool = showRetired ? retiredRecords(records) : liveRecords(records);
      const matched = query ? pool.filter(r => searchMatch(query, searchableFields(r))) : pool;
      const shown = visibleRecords(matched, { childId: filterChild, category: filterCategory }, today);
      const retiredCount = retiredRecords(records).length;

      const childPills = [["all", "Everyone"], ...children().map(c => [c.id, c.name])]
        .map(([id, label]) =>
          `<button class="pill ${filterChild === id ? "active" : ""}" data-child="${esc(id)}">${esc(label)}</button>`)
        .join("");
      const catPills = [["all", "All"], ...CATEGORIES.map(c => [c.id, `${c.icon} ${c.label}`])]
        .map(([id, label]) =>
          `<button class="pill ${filterCategory === id ? "active" : ""}" data-cat="${esc(id)}">${esc(label)}</button>`)
        .join("");

      el.innerHTML = `
        <div class="toolbar">
          <input type="search" id="q" placeholder="Search records…" value="${esc(query)}" autocomplete="off">
          ${canWrite() ? `<button class="btn btn-primary" id="add">+ Add record</button>` : ""}
          ${retiredCount ? `<button class="btn" id="toggle-retired">${showRetired ? "← Back to current" : `Retired (${retiredCount})`}</button>` : ""}
        </div>
        ${canWrite() ? "" : `<p class="hint">You can open and download everything here. Adding, replacing and
          retiring records is the parents\u2019 own — that is what keeps this a shared record rather than a shared draft.</p>`}
        ${openPurges().map(purgeBanner).join("")}
        <div class="pills">${childPills}</div>
        <div class="pills">${catPills}</div>
        ${shown.length ? shown.map(r => recordCard(r, today)).join("") : `
          <div class="empty"><span class="empty-icon">🗂️</span>
            ${records.length ? "Nothing matches those filters." : "No records yet. Add the custody agreement, an insurance card, or a school form."}
          </div>`}
      `;

      el.querySelector("#add")?.addEventListener("click", () => openRecordModal());
      el.querySelector("#toggle-retired")?.addEventListener("click", () => { showRetired = !showRetired; render(); });
      el.querySelectorAll("[data-history]").forEach(b =>
        b.addEventListener("click", () => openHistoryModal(b.dataset.history)));
      el.querySelectorAll("[data-purge]").forEach(b =>
        b.addEventListener("click", () => openPurgeModal(b.dataset.purge)));
      el.querySelectorAll("[data-purge-sign]").forEach(b =>
        b.addEventListener("click", () => onSignPurge(b.dataset.purgeSign, true)));
      el.querySelectorAll("[data-purge-decline]").forEach(b =>
        b.addEventListener("click", () => onSignPurge(b.dataset.purgeDecline, false)));
      el.querySelectorAll("[data-child]").forEach(b =>
        b.addEventListener("click", () => { filterChild = b.dataset.child; render(); }));
      el.querySelectorAll("[data-cat]").forEach(b =>
        b.addEventListener("click", () => { filterCategory = b.dataset.cat; render(); }));

      const q = el.querySelector("#q");
      q?.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          query = q.value;
          render();
          // Re-rendering blows away focus mid-typing; put the caret back.
          const next = document.getElementById("q");
          if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
        }, 200);
      });

      el.querySelectorAll("[data-edit]").forEach(b =>
        b.addEventListener("click", () => openRecordModal(records.find(r => r.id === b.dataset.edit))));
      el.querySelectorAll("[data-retire]").forEach(b =>
        b.addEventListener("click", () => onRetireRecord(b.dataset.retire)));
    }

    function recordCard(r, today) {
      const cat = categoryFor(r.category);
      const status = expiryStatus(r, today);
      const chip = status === "expired" || status === "soon" && !r.retired_at
        ? `<span class="chip chip-${status}">${esc(expiryLabel(r, today))}</span>` : "";
      const who = r.child_id ? memberName(r.child_id) : "Whole family";
      const size = r.size_bytes ? ` · ${esc(fmtBytes(r.size_bytes))}` : "";
      const kept = versionsOf(r, recordVersions).length - 1;
      const purge = purgeStateFor(r.id, purges);

      return `
        <div class="card">
          <div class="spread">
            <div>
              <div class="rec-title">${cat.icon} ${esc(r.title)}</div>
              <div class="rec-meta">${esc(cat.label)} · ${esc(who)}${size}${
                kept > 0 ? ` · v${esc(String(r.version ?? 1))}, ${kept} earlier version${kept === 1 ? "" : "s"} kept` : ""}</div>
            </div>
            ${r.retired_at ? `<span class="chip chip-retired">Retired</span>` : chip}
          </div>
          ${r.note ? `<div class="rec-note">${esc(r.note)}</div>` : ""}
          ${r.retired_at ? `<div class="rec-meta" style="margin-top:8px">Retired ${esc(String(r.retired_at).slice(0, 10))}${
            r.retired_by ? ` by ${esc(memberName(r.retired_by))}` : ""}${r.retire_reason ? ` — ${esc(r.retire_reason)}` : ""}
            · the file is still here</div>` : ""}
          ${purge.state === "pending" ? `<div class="rec-meta" style="margin-top:8px">🕓 Permanent deletion proposed.
            The record and its file stay until both parents agree.</div>` : ""}
          <div class="rec-actions">
            ${r.file_id ? `<a class="btn btn-sm" href="${esc(FILES.url(r.file_id))}" target="_blank" rel="noopener">Open file ↗</a>` : ""}
            ${kept > 0 ? `<button class="btn btn-sm" data-history="${esc(r.id)}">History (${kept + 1})</button>` : ""}
            ${canWrite() && !r.retired_at ? `<button class="btn btn-sm" data-edit="${esc(r.id)}">Replace</button>` : ""}
            ${canWrite() && !r.retired_at ? `<button class="btn btn-sm btn-danger" data-retire="${esc(r.id)}">Retire</button>` : ""}
            ${canWrite() && r.retired_at && purge.state === "none" && twoParty()
              ? `<button class="btn btn-sm btn-danger" data-purge="${esc(r.id)}">Destroy for good…</button>` : ""}
          </div>
        </div>`;
    }

    /** Purge proposals still awaiting both signatures. Shown to every adult who
     *  can see the record: whether THIS viewer still has to sign is the hub's
     *  answer at the moment they click, not a stance this list can cache. */
    function openPurges() {
      return purges.filter(p => p.status === "pending");
    }

    function purgeBanner(p) {
      return `
        <div class="card" style="border-color:#fca5a5">
          <strong>Destroy “${esc(p.record_title ?? "a record")}” permanently?</strong>
          <div class="rec-meta" style="margin-top:4px">This deletes the record and its file for good, ahead of the
            retention window. It takes both parents; if you are the one who proposed it, your agreement is already
            recorded.</div>
          ${p.reason ? `<div class="rec-note">${esc(p.reason)}</div>` : ""}
          ${canWrite() ? `<div class="rec-actions">
            <button class="btn btn-sm btn-danger" data-purge-sign="${esc(p.id)}">Agree to destroy</button>
            <button class="btn btn-sm" data-purge-decline="${esc(p.id)}">Decline</button>
          </div>` : ""}
        </div>`;
    }

    /** True where there is a second parent household to countersign at all. In a
     *  household install nobody can be asked, so the option is never offered —
     *  the vault is an ordinary family document store there. */
    function twoParty() {
      return (window.__SPACE_KIND ?? null) === "coparenting";
    }

    /**
     * Whether this member may write records here.
     *
     * A guess, and only ever used to decide what to RENDER: the hub resolves the
     * live steward seating on every write and refuses there. Rendering a Replace
     * button a supporting adult cannot use would be worse than not rendering it,
     * but believing this instead of the hub would be worse still.
     */
    function canWrite() {
      return canRead() && (!twoParty() || !!window.__IS_ADMIN);
    }

    // ── Child info view ──────────────────────────────────────────────────────
    function renderChildren(el) {
      const kids = children();
      if (!kids.length) {
        el.innerHTML = `<div class="empty"><span class="empty-icon">🧒</span>
          No children in this household yet.</div>`;
        return;
      }
      el.innerHTML = kids.map(kid => {
        const info = childInfo.get(kid.id);
        const groups = groupedChildInfo(info);
        return `
          <div class="card">
            <div class="spread">
              <div>
                <strong>${esc(kid.name)}</strong>
                ${info?.updated_by ? `<div class="rec-meta">Last changed by ${esc(memberName(info.updated_by))}${
                  info.updated_at ? ` on ${esc(String(info.updated_at).slice(0, 10))}` : ""}${
                  Number(info.version ?? 1) > 1 ? ` · v${esc(String(info.version))}` : ""}</div>` : ""}
              </div>
              <button class="btn btn-sm" data-info="${esc(kid.id)}">${isChildInfoEmpty(info) ? "Add details" : "Edit"}</button>
            </div>
            ${groups.length ? groups.map(g => `
              <div class="info-group">
                <h4>${esc(g.group)}</h4>
                ${g.fields.map(f => `
                  <div class="info-row">
                    <span class="info-key">${esc(f.label)}</span>
                    <span class="info-val">${esc(f.value)}</span>
                  </div>`).join("")}
              </div>`).join("") : `<p class="muted" style="margin:10px 0 0">
                Sizes, allergies, doctor and school — the things a caregiver asks for.</p>`}
          </div>`;
      }).join("");

      el.querySelectorAll("[data-info]").forEach(b =>
        b.addEventListener("click", () => openChildInfoModal(b.dataset.info)));
    }

    // ── Modal plumbing ───────────────────────────────────────────────────────
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
      // The autofocus attribute is blocked in the cross-origin app iframe.
      requestAnimationFrame(() => modalEl?.querySelector("[data-autofocus]")?.focus());
      document.addEventListener("keydown", onEsc);
      return modalEl;
    }
    function onEsc(e) { if (e.key === "Escape") closeModal(); }
    function closeModal() {
      if (!modalEl) return;
      document.removeEventListener("keydown", onEsc);
      modalEl.remove();
      modalEl = null;
    }

    // ── Add / edit a record ──────────────────────────────────────────────────
    function openRecordModal(existing) {
      pendingFile = null;
      const kidOptions = [`<option value="">Whole family</option>`,
        ...children().map(c =>
          `<option value="${esc(c.id)}" ${existing?.child_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`)].join("");

      const root = openModal(`
        <h3>${existing ? "Edit record" : "Add record"}</h3>
        <label class="field"><span>Title</span>
          <input type="text" id="m-title" maxlength="200" data-autofocus
                 value="${esc(existing?.title ?? "")}" placeholder="e.g. Custody agreement">
        </label>
        <div class="field-row">
          <label class="field"><span>Category</span>
            <select id="m-cat">
              ${CATEGORIES.map(c => `<option value="${esc(c.id)}" ${(existing?.category ?? "other") === c.id ? "selected" : ""}>${c.icon} ${esc(c.label)}</option>`).join("")}
            </select>
          </label>
          <label class="field"><span>Applies to</span>
            <select id="m-child">${kidOptions}</select>
          </label>
        </div>
        <label class="field"><span>Expires on (optional)</span>
          <input type="date" id="m-expires" value="${esc(existing?.expires_on ?? "")}">
        </label>
        <label class="field"><span>Notes</span>
          <textarea id="m-note" maxlength="2000" placeholder="Policy numbers, where the original lives, who has a copy…">${esc(existing?.note ?? "")}</textarea>
        </label>
        ${CAN_UPLOAD ? `
          <label class="field"><span>${existing?.file_id ? "Replace the file (optional)" : "Attach a file (optional)"}</span>
            <input type="file" id="m-file"
                   accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          </label>
          <p class="hint" id="m-file-status"></p>` : ""}
        ${existing?.file_id ? `<p class="hint">A file is attached. Choosing a new one supersedes it — the version
          you replace stays downloadable from this record\u2019s history.</p>` : ""}
        <div class="modal-actions">
          <button class="btn" id="m-cancel">Cancel</button>
          <button class="btn btn-primary" id="m-save">${existing ? "Save" : "Add record"}</button>
        </div>
      `);

      root.querySelector("#m-cancel").addEventListener("click", closeModal);
      root.querySelector("#m-file")?.addEventListener("change", onFilePicked);
      root.querySelector("#m-save").addEventListener("click", () => onSaveRecord(existing));
    }

    // Upload on pick, not on save: a DB row must never point at a file whose
    // upload failed (415 wrong type, 413 too large, 507 out of storage).
    async function onFilePicked() {
      const input = document.getElementById("m-file");
      const status = document.getElementById("m-file-status");
      const file = input?.files?.[0];
      pendingFile = null;
      if (!file) { if (status) status.textContent = ""; return; }

      if (status) status.textContent = "Uploading…";
      try {
        const { id } = await FILES.upload(file);
        pendingFile = { id, name: file.name, mime: file.type, size: file.size };
        if (status) status.textContent = `✓ ${file.name} attached`;
      } catch (e) {
        if (input) input.value = "";
        if (status) status.textContent = "";
        hubAlert(`Could not attach that file: ${e.message}`);
      }
    }

    async function onSaveRecord(existing) {
      const btn = document.getElementById("m-save");
      const rec = {
        title:      document.getElementById("m-title").value.trim(),
        category:   document.getElementById("m-cat").value,
        child_id:   document.getElementById("m-child").value || null,
        expires_on: document.getElementById("m-expires").value || null,
        note:       document.getElementById("m-note").value.trim(),
        file_id:    pendingFile?.id ?? existing?.file_id ?? null,
      };
      const check = validateRecord(rec);
      if (!check.ok) { hubAlert(check.error); return; }

      btn.disabled = true; btn.textContent = "Saving…";
      const uploaded = pendingFile;   // captured for rollback below
      const values = {
        ...rec,
        record_kind: rec.file_id ? "document" : "reference",
        mime_type:   uploaded?.mime ?? existing?.mime_type ?? null,
        size_bytes:  uploaded?.size ?? existing?.size_bytes ?? null,
      };

      try {
        if (DEMO) {
          // no-op: the demo state is refreshed from the seed below
        } else if (existing) {
          // A replace, not an update: the hub copies the current row — the file
          // it points at included — into the version table in the same
          // transaction. `version` is the record as this tab last read it, so
          // two parents editing at once get a 409 rather than one of the two
          // versions they each meant to keep going missing.
          await VERSIONED.replace("records", existing.id, values, existing.version ?? 1);
        } else {
          await VERSIONED.create("records", values);
        }
        pendingFile = null;
        closeModal();
        if (!DEMO) await loadData();
        render();
      } catch (e) {
        btn.disabled = false; btn.textContent = existing ? "Save" : "Add record";
        // The file uploaded but nothing references it — drop it rather than
        // leave an orphan counting against the storage quota. Only ever the
        // file THIS attempt uploaded: the record\u2019s existing file belongs to a
        // version that is still in force.
        if (uploaded) {
          FILES.delete(uploaded.id).catch(() => {});
          pendingFile = null;
        }
        hubAlert(e.message);
      }
    }

    async function onRetireRecord(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      const ok = await hubConfirm(
        `Retire “${rec.title}”? It comes out of the current list and its file is kept — nothing is destroyed.`,
        { confirmLabel: "Retire" },
      );
      if (!ok) return;
      try {
        if (!DEMO) await VERSIONED.retire("records", id, rec.version ?? 1);
        if (!DEMO) await loadData();
        else { rec.retired_at = new Date().toISOString(); rec.retired_by = me?.id ?? null; }
        render();
      } catch (e) { hubAlert(e.message); }
    }

    // ── Destroying a record for good (both parents) ──────────────────────────
    function openPurgeModal(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      const root = openModal(`
        <h3>Destroy “${esc(rec.title)}” for good?</h3>
        <p class="hint">This is the one thing here that cannot be undone: the record, every earlier version of it,
          and the files behind them are deleted ahead of the retention window. It takes both parents — the other
          parent sees this proposal and nothing happens until they agree.</p>
        <label class="field"><span>Why (the other parent sees this)</span>
          <textarea id="pg-reason" maxlength="500" data-autofocus
                    placeholder="e.g. uploaded to the wrong child, or a duplicate of the signed copy"></textarea>
        </label>
        <div class="modal-actions">
          <button class="btn" id="pg-cancel">Cancel</button>
          <button class="btn btn-primary btn-danger" id="pg-send">Propose deletion</button>
        </div>
      `);
      root.querySelector("#pg-cancel").addEventListener("click", closeModal);
      root.querySelector("#pg-send").addEventListener("click", async () => {
        const btn = document.getElementById("pg-send");
        btn.disabled = true; btn.textContent = "Sending…";
        try {
          if (!DEMO) {
            const res = await fetch(`/run/${APP_ID}/api/propose-agreement`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                table: "record_purge_agreements",
                values: {
                  record_id: rec.id,
                  record_title: rec.title,
                  reason: document.getElementById("pg-reason").value.trim() || null,
                },
              }),
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(json?.error ?? `Request failed: ${res.status}`);
            // Proposing is not agreeing: the same countersignature path decides
            // every lock, including the one-party case.
            await signPurge(json.id, true);
            await loadData();
          }
          closeModal();
          render();
        } catch (e) {
          btn.disabled = false; btn.textContent = "Propose deletion";
          hubAlert(e.message);
        }
      });
    }

    async function signPurge(id, agreed) {
      const res = await fetch(`/run/${APP_ID}/api/agree`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ table: "record_purge_agreements", id, agreed, resolution: !agreed }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json?.error ?? `Request failed: ${res.status}`);
      return json;
    }

    async function onSignPurge(id, agreed) {
      const row = purges.find(p => p.id === id);
      if (agreed && !await hubConfirm(
        `Agree to destroy “${row?.record_title ?? "this record"}” for good? Once you both agree it cannot be recovered.`,
        { confirmLabel: "Agree to destroy" },
      )) return;
      try {
        await signPurge(id, agreed);
        await loadData();
        render();
      } catch (e) { hubAlert(e.message); }
    }

    // ── History ──────────────────────────────────────────────────────────────
    function openHistoryModal(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      const all = versionsOf(rec, recordVersions);
      openModal(`
        <h3>${esc(rec.title)} — history</h3>
        <p class="hint">Every version this record has had. Replacing a document never removed the one it replaced,
          so the earlier files are still here.</p>
        ${all.map(v => `
          <div class="card">
            <div class="spread">
              <div>
                <div class="rec-title">v${esc(String(v.version ?? 1))}${v.current ? " · in force" : ""}</div>
                <div class="rec-meta">${esc(v.title ?? "")}${v.category ? ` · ${esc(categoryFor(v.category).label)}` : ""}</div>
                <div class="rec-meta">${v.current
                  ? `Since ${esc(String(v.updated_at ?? v.created_at ?? "").slice(0, 10))}`
                  : `Superseded ${esc(String(v.superseded_at ?? "").slice(0, 10))}${
                      v.superseded_by ? ` by ${esc(memberName(v.superseded_by))}` : ""}`}</div>
              </div>
              ${v.file_id ? `<a class="btn btn-sm" href="${esc(FILES.url(v.file_id))}" target="_blank" rel="noopener">Open file ↗</a>` : ""}
            </div>
            ${v.note ? `<div class="rec-note">${esc(v.note)}</div>` : ""}
          </div>`).join("")}
        <div class="modal-actions"><button class="btn" id="h-close">Close</button></div>
      `).querySelector("#h-close").addEventListener("click", closeModal);
    }

    // ── Child info editor ────────────────────────────────────────────────────
    function openChildInfoModal(childId) {
      const info = childInfo.get(childId) ?? {};
      const root = openModal(`
        <h3>${esc(memberName(childId))}</h3>
        ${CHILD_INFO_FIELDS.map((f, i) => `
          <label class="field"><span>${esc(f.label)}</span>
            ${f.multiline
              ? `<textarea id="ci-${esc(f.key)}" maxlength="1000">${esc(info[f.key] ?? "")}</textarea>`
              : `<input type="text" id="ci-${esc(f.key)}" maxlength="200" ${i === 0 ? "data-autofocus" : ""} value="${esc(info[f.key] ?? "")}">`}
          </label>`).join("")}
        <div class="modal-actions">
          <button class="btn" id="ci-cancel">Cancel</button>
          <button class="btn btn-primary" id="ci-save">Save</button>
        </div>
      `);
      root.querySelector("#ci-cancel").addEventListener("click", closeModal);
      root.querySelector("#ci-save").addEventListener("click", () => onSaveChildInfo(childId));
    }

    async function onSaveChildInfo(childId) {
      const btn = document.getElementById("ci-save");
      const existing = childInfo.get(childId);
      const values = Object.fromEntries(
        CHILD_INFO_FIELDS.map(f => [f.key, document.getElementById(`ci-${f.key}`).value.trim() || null]));
      const changed = changedChildInfo(existing, values);
      if (existing && Object.keys(changed).length === 0) { closeModal(); return; }

      btn.disabled = true; btn.textContent = "Saving…";
      try {
        if (!DEMO) {
          if (existing) {
            // Versioned, never governed: any adult may edit sizes and phone
            // numbers — countersigning a shoe size would kill the daily use this
            // card exists for — but the card they replaced is kept, with the name
            // of whoever changed it. That is what makes a step-parent's edit
            // safe rather than dangerous.
            await VERSIONED.replace("child_info", childId, changed, existing.version ?? 1);
          } else {
            await VERSIONED.create("child_info", { child_id: childId, ...values });
          }
          await loadData();
        } else {
          childInfo.set(childId, { child_id: childId, ...values, updated_by: me?.id ?? null,
            updated_at: new Date().toISOString(), version: (existing?.version ?? 0) + 1 });
        }
        closeModal();
        render();
      } catch (e) {
        btn.disabled = false; btn.textContent = "Save";
        hubAlert(e.message);
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    (async () => {
      await loadMembers();
      await loadData();
      render();
    })();
  </script>
</body>
</html>
